<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>CivicPulse Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#f4f6f9;
}

.card{
    border-radius:15px;
}

h2{
    color:#0d6efd;
    font-weight:bold;
}

canvas{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container mt-4">

<h2 class="text-center mb-4">
📊 CivicPulse Reports & Analytics
</h2>

<div class="row">

<div class="col-md-3 mb-3">
<div class="card shadow p-3 text-center">
<h5>Total Complaints</h5>
<h2 th:text="${totalComplaints}"></h2>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card shadow p-3 text-center">
<h5>Pending</h5>
<h2 th:text="${pendingComplaints}"></h2>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card shadow p-3 text-center">
<h5>Resolved</h5>
<h2 th:text="${resolvedComplaints}"></h2>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card shadow p-3 text-center">
<h5>Escalated</h5>
<h2 th:text="${escalatedComplaints}"></h2>
</div>
</div>

</div>

<hr>

<div class="row">

<div class="col-md-6">

<h4 class="text-center">
Complaint Status
</h4>

<canvas id="statusChart"></canvas>

</div>

<div class="col-md-6">

<h4 class="text-center">
Department Wise Complaints
</h4>

<canvas id="departmentChart"></canvas>

</div>

</div>

<br>

<a href="/dashboard" class="btn btn-primary">
⬅ Back to Dashboard
</a>

</div>

<script th:inline="javascript">

// Status Chart

new Chart(document.getElementById("statusChart"),{

type:'pie',

data:{

labels:[
'Pending',
'Resolved',
'In Progress',
'Escalated'
],

datasets:[{

	data:[
	/*[[${pendingComplaints}]]*/ 0,
	/*[[${resolvedComplaints}]]*/ 0,
	/*[[${inProgressComplaints}]]*/ 0,
	/*[[${escalatedComplaints}]]*/ 0
	]

}]

}

});

// Department Chart

new Chart(document.getElementById("departmentChart"),{

type:'bar',

data:{

labels:[
'Road',
'Water',
'Electricity',
'Sanitation',
'Drainage'
],

datasets:[{

label:'Complaints',

data:[
/*[[${roadComplaints}]]*/ 0,
/*[[${waterComplaints}]]*/ 0,
/*[[${electricityComplaints}]]*/ 0,
/*[[${sanitationComplaints}]]*/ 0,
/*[[${drainageComplaints}]]*/ 0
]

}]

}

});

</script>

</body>
</html>
