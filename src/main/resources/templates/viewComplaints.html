<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>View Complaints</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    width:98%;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#0066cc;
}

.search-box{
    text-align:center;
    margin-bottom:20px;
}

.search-box input{
    width:350px;
    padding:10px;
}

.search-box button{
    padding:10px 20px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

table,th,td{
    border:1px solid #ccc;
}

th{
    background:#0066cc;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
}

.btn{
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:5px;
    display:inline-block;
}

.edit{
    background:green;
}

.delete{
    background:red;
}

.back{
    background:#0066cc;
    margin-top:20px;
    display:inline-block;
}

.high{
    color:red;
    font-weight:bold;
}

.medium{
    color:orange;
    font-weight:bold;
}

.low{
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>📋 View Complaints</h2>

<div class="search-box">

<form action="/viewComplaints" method="get">

<input type="text"
name="keyword"
placeholder="Search by Title or Category"
th:value="${keyword}">

<button type="submit">🔍 Search</button>

</form>

</div>

<table>

<tr>

<th>Tracking ID</th>
<th>Title</th>
<th>Category</th>
<th>Department</th>
<th>Officer</th>
<th>Priority</th>
<th>Due Date</th>
<th>SLA Status</th>
<th>Description</th>
<th>Location</th>
<th>Status</th>
<th>Action</th>

</tr>

<tr th:each="complaint : ${complaints}">

<td th:text="${complaint.trackingId}"></td>
<td th:text="${complaint.title}"></td>
<td th:text="${complaint.category}"></td>
<td th:text="${complaint.department}"></td>
<td th:text="${complaint.officer}"></td>

<td>
<span th:text="${complaint.priority}"
th:class="${complaint.priority=='High'} ? 'high' :
(${complaint.priority=='Medium'} ? 'medium' : 'low')">
</span>
</td>

<td th:text="${complaint.dueDate}"></td>
<td>

    <span th:if="${complaint.dueDate.isAfter(T(java.time.LocalDate).now())}"
          style="color:green;font-weight:bold;">

        🟢 Within SLA

    </span>

    <span th:if="${complaint.dueDate.isEqual(T(java.time.LocalDate).now())}"
          style="color:orange;font-weight:bold;">

        🟡 Due Today

    </span>

    <span th:if="${complaint.dueDate.isBefore(T(java.time.LocalDate).now())}"
          style="color:red;font-weight:bold;">

        🔴 Overdue

    </span>

</td>
<td th:text="${complaint.description}"></td>
<td th:text="${complaint.location}"></td>
<td>

<span th:if="${complaint.status=='Resolved'}"
style="color:green;font-weight:bold;">

🟢 Resolved

</span>

<span th:if="${complaint.status=='Pending'}"
style="color:orange;font-weight:bold;">

🟡 Pending

</span>

<span th:if="${complaint.status=='In Progress'}"
style="color:blue;font-weight:bold;">

🔵 In Progress

</span>

<span th:if="${complaint.status=='Escalated'}"
style="color:red;font-weight:bold;">

🔴 Escalated

</span>

</td>

<td>

<a th:href="@{/editComplaint/{id}(id=${complaint.id})}"
class="btn edit">
Edit
</a>

<a th:href="@{/deleteComplaint/{id}(id=${complaint.id})}"
class="btn delete"
onclick="return confirm('Are you sure you want to delete this complaint?')">
Delete
</a>

</td>

</tr>

<tr th:if="${#lists.isEmpty(complaints)}">

<td colspan="11"
style="text-align:center;color:red;font-weight:bold;">

No complaints found.

</td>

</tr>

</table>

<a href="/dashboard" class="btn back">⬅ Back</a>

</div>

</body>
</html>
