<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Officer Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}

.container{
    margin-top:40px;
}

.card{
    border-radius:15px;
}
</style>

</head>

<body>

<div class="container">

<h2 class="text-center text-primary">
Officer Dashboard
</h2>

<div class="card mt-4 p-4">

<h4>Welcome Officer 👮</h4>

<p>Manage Assigned Complaints</p>

<hr>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Officer</th>
            <th>Action</th>

        </tr>

    </thead>

    <tbody>

        <tr th:each="complaint : ${complaints}">

            <td th:text="${complaint.id}"></td>

            <td th:text="${complaint.title}"></td>

            <td th:text="${complaint.status}"></td>

            <td th:text="${complaint.officer}"></td>

            <td>

                <a th:href="@{/updateStatus/{id}(id=${complaint.id})}"
                   class="btn btn-warning btn-sm">

                    Update Status

                </a>

            </td>

        </tr>

    </tbody>

</table>

</div>

</div>

</body>
</html>
