<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Officer - Certificate Applications</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

<style>

body {
    background: #f4f6f9;
}

.container {
    margin-top: 40px;
}

.card {
    border-radius: 12px;
}

h2 {
    color: #0066cc;
}

</style>

</head>

<body>

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="mb-0">
                📜 Certificate Applications
            </h2>

        </div>


        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>Application ID</th>

                            <th>Applicant</th>

                            <th>Certificate Type</th>

                            <th>Department</th>

                            <th>Status</th>

                            <th>Verification</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr th:each="certificate : ${certificates}">

                            <td th:text="${certificate.applicationId}">
                            </td>


                            <td th:text="${certificate.applicantName}">
                            </td>


                            <td th:text="${certificate.certificateType}">
                            </td>


                            <td th:text="${certificate.department}">
                            </td>


                            <!-- STATUS -->

                            <td>

                                <span
                                    th:if="${certificate.status == 'Pending'}"
                                    class="badge bg-warning text-dark">

                                    Pending

                                </span>


                                <span
                                    th:if="${certificate.status == 'Approved'}"
                                    class="badge bg-success">

                                    Approved

                                </span>

                            </td>


                            <!-- VERIFICATION -->

                            <td>

                                <span
                                    th:if="${certificate.verificationStatus == 'Not Verified'}"
                                    class="badge bg-secondary">

                                    Not Verified

                                </span>


                                <span
                                    th:if="${certificate.verificationStatus == 'Verified'}"
                                    class="badge bg-success">

                                    ✅ Verified

                                </span>

                            </td>


                            <!-- ACTION -->

                            <td>

                                <!-- VERIFY -->

                                <form
                                    th:if="${certificate.verificationStatus != 'Verified'
                                            and certificate.status != 'Approved'}"
                                    action="/officerVerifyCertificate"
                                    method="post"
                                    style="display:inline;">

                                    <input
                                        type="hidden"
                                        name="id"
                                        th:value="${certificate.id}">

                                    <button
                                        type="submit"
                                        class="btn btn-warning btn-sm">

                                        🔍 Verify

                                    </button>

                                </form>


                                <!-- APPROVE -->

                                <form
                                    th:if="${certificate.verificationStatus == 'Verified'
                                            and certificate.status != 'Approved'}"
                                    action="/officerApproveCertificate"
                                    method="post"
                                    style="display:inline;">

                                    <input
                                        type="hidden"
                                        name="id"
                                        th:value="${certificate.id}">

                                    <button
                                        type="submit"
                                        class="btn btn-success btn-sm">

                                        ✅ Approve

                                    </button>

                                </form>


                                <!-- COMPLETED -->

                                <span
                                    th:if="${certificate.status == 'Approved'}"
                                    class="badge bg-success">

                                    ✅ Completed

                                </span>

                            </td>

                        </tr>


                        <!-- NO APPLICATIONS -->

                        <tr
                            th:if="${#lists.isEmpty(certificates)}">

                            <td
                                colspan="7"
                                class="text-center text-danger fw-bold">

                                No certificate applications found.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <a href="/officerComplaints"
               class="btn btn-secondary mt-3">

                ⬅ Back to Officer Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
