<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Complaint</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#0066cc;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}
</style>

</head>
<body>

<div class="container">

<h2>✏️ Edit Complaint</h2>

<form action="/updateComplaint" method="post">

<input type="hidden" name="id" th:value="${complaint.id}">

<label>Title</label>
<input type="text" name="title" th:value="${complaint.title}" required>

<label>Category</label>
<input type="text" name="category" th:value="${complaint.category}" required>

<label>Description</label>
<textarea name="description" rows="4" required
th:text="${complaint.description}"></textarea>

<label>Location</label>
<input type="text" name="location" th:value="${complaint.location}" required>

<label>Status</label>
<select name="status">

<option value="Pending"
th:selected="${complaint.status=='Pending'}">
Pending
</option>

<option value="In Progress"
th:selected="${complaint.status=='In Progress'}">
In Progress
</option>

<option value="Resolved"
th:selected="${complaint.status=='Resolved'}">
Resolved
</option>

</select>

<button type="submit">Update Complaint</button>

</form>

</div>

</body>
</html>
