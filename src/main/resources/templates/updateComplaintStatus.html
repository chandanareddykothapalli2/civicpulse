<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Update Complaint Status</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}
.container{
    margin-top:50px;
    max-width:600px;
}
.card{
    border-radius:15px;
}
</style>

</head>
<body>

<div class="container">

<div class="card p-4">

<h2 class="text-center text-primary">
Update Complaint Status
</h2>

<form th:action="@{/updateStatus}" method="post">

<input type="hidden"
       name="id"
       th:value="${complaint.id}">

<div class="mb-3">
<label>Tracking ID</label>
<input type="text"
class="form-control"
th:value="${complaint.trackingId}"
readonly>
</div>

<div class="mb-3">
<label>Complaint Title</label>
<input type="text"
class="form-control"
th:value="${complaint.title}"
readonly>
</div>

<div class="mb-3">
<label>Status</label>

<select
name="status"
class="form-select">

<option value="Pending">Pending</option>

<option value="In Progress">In Progress</option>

<option value="Resolved">Resolved</option>

</select>

</div>

<button
class="btn btn-success w-100">

Update Status

</button>

</form>

</div>

</div>

</body>
</html>
